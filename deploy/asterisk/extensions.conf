; ============================================================
; SIPVoice - 拨号方案
; ============================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
AI_AUDIOSOCKET=127.0.0.1:9092
FAX_SPOOL=/var/spool/asterisk/fax

[internal]
; ---- 兼容客户端自动加 + 前缀（如 +600） ----
exten => _+X.,1,Set(NUM=${EXTEN:1})
 same => n,Goto(internal,${NUM},1)

; ---- 9000 : AI 语音对话（AudioSocket 交给 Go 服务） ----
exten => 9000,1,NoOp(SIPVoice AI bot, caller=${CALLERID(num)})
 same => n,Answer()
 ; 录音开关与目录由面板写入 AstDB（sipvoice/rec、sipvoice/rec_dir）
 same => n,Set(RECDIR=${DB(sipvoice/rec_dir)})
 same => n,GotoIf($["${DB(sipvoice/rec)}" = "1" & "${RECDIR}" != ""]?rec:ai)
 same => n(rec),MixMonitor(${RECDIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}.wav)
 same => n(ai),AudioSocket(${SHELL(uuidgen | tr -d '\n')},${AI_AUDIOSOCKET})
 same => n,Hangup()

; ---- 600 : 传真接收 ----
; 优先 T.38，对端不支持时自动回落 G.711
; ECM 关闭：公网 T.38 的 UDPTL 丢包会让 ECM 重传拉长握手甚至失败
exten => 600,1,NoOp(SIPVoice fax receive, caller=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(FAXOPT(ecm)=no)
 same => n,ReceiveFAX(${FAX_SPOOL}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.tiff)
 same => n,NoOp(传真结果=${FAXOPT(status)} 页数=${FAXOPT(pages)} 速率=${FAXOPT(rate)} 错误=${FAXOPT(error)})
 ; 传完等一下，给对方发 DCN 断开确认的时间，避免发送方误报"未接通"
 same => n,Wait(3)
 same => n,Hangup()

; ---- 未定义号码 ----
exten => _X.,1,Congestion()
