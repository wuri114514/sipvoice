; ============================================================
; SIPVoice - 拨号方案（Asterisk 22）
; ============================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
AI_AUDIOSOCKET=127.0.0.1:9092

[internal]
; ---- 兼容客户端自动加 + 前缀（如 +9000） ----
exten => _+X.,1,Set(NUM=${EXTEN:1})
 same => n,Goto(internal,${NUM},1)

; ---- 9000 : AI 语音对话（AudioSocket 交给 Go 服务） ----
exten => 9000,1,NoOp(SIPVoice AI bot, caller=${CALLERID(num)})
 same => n,Answer()
 same => n,AudioSocket(${SHELL(uuidgen | tr -d '\n')},${AI_AUDIOSOCKET})
 same => n,Hangup()

; ---- 600 : 传真接收（T.38 / G.711 由 res_fax_spandsp 处理） ----
exten => 600,1,NoOp(SIPVoice fax receive)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(FAXOPT(faxdetect)=yes)
 same => n,ReceiveFAX(/var/spool/asterisk/fax/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.tiff)
 same => n,Hangup()

; ---- 分机互拨 ----
exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,30)
 same => n,Hangup()

; ---- 兜底 ----
exten => _X.,1,NoOp(unknown number ${EXTEN})
 same => n,Playback(silence/1)
 same => n,Congestion()
