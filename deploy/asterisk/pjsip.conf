; ============================================================
; SIPVoice - PJSIP 配置（Asterisk 22）
; 由 AI_OF_SIP/deploy/asterisk/pjsip.conf 同步而来
; 说明：全部显式声明，不使用模板继承，便于排查。
; ============================================================

; ---------- 传输层 ----------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes

; ---------- 1001 : 测试软电话（MicroSIP） ----------
[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=1001-auth
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733
transport=transport-udp

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=SipVoice1001

[1001]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30

; ---------- 1002 : 备用测试分机 ----------
[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=1002-auth
aors=1002
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733
transport=transport-udp

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=SipVoice1002

[1002]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30

