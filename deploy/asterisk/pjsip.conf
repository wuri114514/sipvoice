; ---------- 本机自动化测试端点（calltest，免鉴权，仅限 127.0.0.1） ----------
[calltest]
type=endpoint
context=internal
disallow=all
allow=ulaw
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733
transport=transport-udp

[calltest-identify]
type=identify
endpoint=calltest
match=127.0.0.1
