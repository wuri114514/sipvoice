name: Bug report
description: 报告一个可以复现的问题 / Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量附上日志与复现步骤——这是一个 AI 生成的早期项目，细节越多越容易定位。
        Thanks! This is an AI-generated alpha project, so details matter a lot.
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 运行 `voicebridge -version` 的输出
      placeholder: sipvoice 1.3.0
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: 架构 / Architecture
      options:
        - linux/amd64
        - linux/arm64
        - 其他 (请在下方说明) / other (explain below)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统 / OS
      placeholder: Ubuntu 24.04.1, kernel 6.8
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 期望的结果与实际的差别
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 装好服务，拨 9000
        2. 说完一句话后……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: `journalctl -u sipvoice -n 200 --no-pager` 与 `asterisk -rx "pjsip show endpoints"`
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已经改了默认分机密码 / I changed the default extension passwords
        - label: 我已经搜索过现有 issue / I searched existing issues
