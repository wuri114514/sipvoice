name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: 单元测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    name: 交叉编译 linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/voicebridge-linux-${{ matrix.arch }} ./cmd/voicebridge
          file dist/voicebridge-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: voicebridge-linux-${{ matrix.arch }}
          path: dist/voicebridge-linux-${{ matrix.arch }}
          retention-days: 7
